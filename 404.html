<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Страница не найдена — Mr. Web</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
@font-face {
  font-family: 'Geologica'; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url('assets/fonts/geologica-cyrillic.woff2') format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}
@font-face {
  font-family: 'Geologica'; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url('assets/fonts/geologica-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Golos Text'; font-style: normal; font-weight: 400 600; font-display: swap;
  src: url('assets/fonts/golos-text-cyrillic.woff2') format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}
@font-face {
  font-family: 'Golos Text'; font-style: normal; font-weight: 400 600; font-display: swap;
  src: url('assets/fonts/golos-text-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root {
  --paper: #EDEDE8; --ink: #201C1A; --muted: #63605A;
  --rule: #C8C7C0; --mark: #C6211F; --mark-deep: #8A1614;
  --step: 28px; --edge: clamp(20px, 4.5vw, 64px);
  --display: 'Geologica', system-ui, sans-serif;
  --text: 'Golos Text', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body {
  min-height: 100svh; background: var(--paper); color: var(--ink);
  font: 400 17px/var(--step) var(--text);
  display: flex; flex-direction: column; justify-content: center;
  padding: calc(2 * var(--step)) var(--edge);
  text-wrap: pretty;
}
.in { max-width: 1240px; margin-inline: auto; width: 100%; }
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--display); font-weight: 600; font-size: 18px;
  letter-spacing: -0.01em; text-decoration: none; color: var(--ink);
}
.brand svg { width: 33px; height: 30px; display: block; flex: none; }
h1 {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(36px, 5vw, 66px); line-height: 1.0;
  letter-spacing: -0.03em; margin-top: calc(2 * var(--step)); max-width: 20ch;
}
p { margin-top: var(--step); max-width: 48ch; font-size: 18px; color: var(--muted); }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 22px; margin-top: calc(1.5 * var(--step)); }
.cta {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--display); font-weight: 500; font-size: 15px; line-height: 1;
  color: var(--paper); background: var(--mark);
  padding: 13px 20px; border: 1px solid var(--mark); border-radius: 3px;
  text-decoration: none; white-space: nowrap;
  transition: background 140ms ease, border-color 140ms ease;
}
.cta:hover { background: var(--mark-deep); border-color: var(--mark-deep); }
.aside { font-size: 15.5px; color: var(--muted); }
.aside a { color: var(--mark); text-underline-offset: 3px; }
.aside a:hover { color: var(--mark-deep); }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; border-radius: 2px; }
::selection { background: var(--mark); color: var(--paper); }
.rule { height: 3px; background: var(--mark); width: 96px; margin-top: calc(2 * var(--step)); }
</style>
</head>
<body>
  <div class="in">
    <!-- Ссылка на главную абсолютная намеренно: GitHub Pages отдаёт этот
         файл по любому несуществующему пути, и относительный адрес
         посчитался бы от него, а не от корня сайта. -->
    <a class="brand" href="https://romanbaukin.github.io/mr-web-landing/">
      <svg viewBox="0 6 48 44" aria-hidden="true" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 34V14l12 12 12-12v20" stroke="var(--ink)"/>
        <path d="M18 22v20l12-12 12 12V22" stroke="var(--mark)"/>
      </svg>
      Mr.&nbsp;Web
    </a>

    <h1>Такой страницы нет.</h1>
    <p>Адрес устарел или в нём опечатка. С главной можно посмотреть услуги, цены и сроки.</p>

    <div class="row">
      <a class="cta" href="https://romanbaukin.github.io/mr-web-landing/">На главную</a>
      <span class="aside">Или сразу <a href="https://t.me/roman_baukin" target="_blank" rel="noopener">напишите в Telegram</a></span>
    </div>

    <div class="rule"></div>
  </div>
</body>
</html>
